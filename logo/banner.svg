<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">

  <defs>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">

      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1"></stop>

      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1"></stop>

    </linearGradient>

    

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">

      <feGaussianBlur stdDeviation="4" result="coloredBlur"></feGaussianBlur>

      <feMerge>

        <feMergeNode in="coloredBlur"></feMergeNode>

        <feMergeNode in="SourceGraphic"></feMergeNode>

      </feMerge>

    </filter>

  </defs>



  <rect width="1000" height="300" rx="20" fill="#0f172a"></rect>



  <g transform="translate(60, 50) scale(0.4)">

    <circle cx="256" cy="256" r="100" stroke="#94a3b8" stroke-width="24" fill="none"></circle>

    <line x1="256" y1="156" x2="256" y2="96" stroke="#94a3b8" stroke-width="24" stroke-linecap="round"></line>

    <path d="M 64 256 L 448 256" stroke="#94a3b8" stroke-width="32" stroke-linecap="round"></path>

    

    <path d="M 64 256 L 150 256 Q 200 256 220 220 T 256 256 T 292 292 T 362 256 L 448 256" stroke="url(#neonGrad)" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></path>



    <g transform="translate(380, 380)">

      <circle r="60" fill="#10b981"></circle>

      <path d="M -25 0 L -5 20 L 30 -20" stroke="white" stroke-width="15" stroke-linecap="round" fill="none"></path>

    </g>

  </g>



  <text x="280" y="175" font-family="Inter, Segoe UI, sans-serif" font-weight="800" font-size="100" letter-spacing="-2">

    <tspan fill="#ffffff">CT</tspan>

    <tspan fill="url(#neonGrad)">Sizer</tspan>

  </text>

  

  <text x="285" y="220" font-family="Inter, Segoe UI, sans-serif" font-weight="400" font-size="24" fill="#64748b" letter-spacing="4">

    Instrument transformer calculation

  </text>

</svg>