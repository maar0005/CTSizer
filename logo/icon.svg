<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"></stop>
    </linearGradient>
    
    
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1"></stop>
    </linearGradient>
    
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  
  
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"></rect>
  
  
  <g transform="translate(256, 256)">
    
    <circle cx="0" cy="0" r="100" stroke="#94a3b8" stroke-width="24" fill="none" opacity="1"></circle>
    
    
    <line x1="-0" y1="-100" x2="-0" y2="-160" stroke="#94a3b8" stroke-width="24" stroke-linecap="round"></line>
    
    
    
  
   
  </g>
  
  
  <path d="M 64 256 L 180 256 L 256 256 L 332 256 L 448 256" stroke="#94a3b8" stroke-width="32" stroke-linecap="round"></path>
  
  
  <path d="M 64 256 L 150 256 Q 200 256 220 220 T 256 256 T 292 292 T 362 256 L 448 256" stroke="url(#neonGrad)" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></path>

  
  <g transform="translate(380, 380)">
    <circle r="48" fill="#10b981" stroke="#0f172a" stroke-width="8"></circle>
    <path d="M -20 0 L -5 15 L 20 -15" stroke="white" stroke-width="10" stroke-linecap="round" fill="none"></path>
  </g>

</svg>